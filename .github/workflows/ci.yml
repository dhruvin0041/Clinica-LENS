name: Clinica-LENS CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov bandit flake8
        
    - name: Security scan (Bandit)
      run: |
        bandit -r src/ app/ -ll
        
    - name: Linting (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Run Tests with Coverage
      run: |
        pytest tests/ --cov=src --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-docker:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build API Docker image
      run: docker build -t clinica-lens-api -f Dockerfile.api .
      
    - name: Build UI Docker image
      run: docker build -t clinica-lens-ui -f Dockerfile.ui .
