apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinica-lens-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinica-lens-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinica-lens-api-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: clinica-lens
      component: api
